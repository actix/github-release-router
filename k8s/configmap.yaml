apiVersion: v1
kind: ConfigMap
metadata:
  name: github-release-router-config
  namespace: github-release-router
data:
  config.toml: |
    bind = "0.0.0.0:8080"

    [sources.releases]
    repositories = ["example/app"]
    secret = { file = "/run/secrets/github_webhook_secret" }

    [destinations.releases]
    webhook = { file = "/run/secrets/discord_webhook_url" }

    [[routes]]
    name = "app-releases"
    repository = "example/app"
    destinations = ["releases"]
