apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-release-router
  namespace: github-release-router
spec:
  # SQLite and the process lock require one active pod per database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: github-release-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-release-router
    spec:
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: ghcr.io/replace-me/github-release-router:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/router/config.toml", "serve"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: RUST_LOG
              value: github_release_router=info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/router
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: github-release-router-data
        - name: config
          configMap:
            name: github-release-router-config
        - name: secrets
          secret:
            secretName: github-release-router-secrets
            defaultMode: 0400
