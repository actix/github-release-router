name: Build and publish container image

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build container image (amd64)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    env:
      PUBLISH_IMAGE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out source
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long

      - name: Build candidate image
        id: build
        uses: useblacksmith/build-push-action@v2 # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          load: ${{ env.PUBLISH_IMAGE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install smoke test tools
        if: env.PUBLISH_IMAGE != 'true'
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,ripgrep

      - name: Test the local candidate image
        if: env.PUBLISH_IMAGE != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: just container-smoke "$IMAGE"

  promote:
    name: Promote the tested image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [checks, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DIGEST: ${{ needs.publish.outputs.digest }}

    steps:
      - name: Check out source
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Install smoke test tools
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,ripgrep

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test the candidate image
        run: just container-smoke "$IMAGE@$DIGEST"

      - name: Promote and record the deployment image
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:stable" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

          printf 'Deploy image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
