bind = "0.0.0.0:8080"

# Replace example/app in both the allowlist and the route below.
# Configure GitHub to send releases to /webhooks/github/releases.
[sources.releases]
repositories = ["example/app"]
secret = { file = "/run/secrets/github_webhook_secret" }
# Alternative: secret = { env = "GITHUB_WEBHOOK_SECRET" }

[destinations.releases]
webhook = { file = "/run/secrets/discord_webhook_url" }
# Alternative: webhook = { env = "DISCORD_WEBHOOK_URL" }

[[routes]]
name = "app-releases"
repository = "example/app"
destinations = ["releases"]

# Optional. Prereleases are excluded by default.
# include_prereleases = true

# Optional. All tags are allowed by default. Patterns are case-insensitive regexes.
# include_tags = ["^v[0-9]+[.][0-9]+[.][0-9]+$"]
# exclude_tags = ["-(internal|test)$"]
