[package]
name = "github-release-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
actix-web = "4"
actix-web-lab = "0.27"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-actix-web = "0.7.25"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
